name: Deploy Non

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip zip if present
        run: |
          mkdir -p _site
          if [ -f "non files.zip" ]; then
            echo "found: non files.zip"
            unzip -o "non files.zip" -d _site
          elif [ -f non_files.zip ]; then
            echo "found: non_files.zip"
            unzip -o non_files.zip -d _site
          elif [ -f nonfiles.zip ]; then
            echo "found: nonfiles.zip"
            unzip -o nonfiles.zip -d _site
          else
            echo "no zip. publishing root files."
            rsync -av --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          fi
          echo "=== _site contents ==="
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
